<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Giallo Oro Gioielli Shop</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Manrope:wght@300;400;500;600;700&display=swap">
<style>
/* Layout: boutique-catalogue — sticky ivory header, editorial hero, filterable grid, product sheet, staff console. Single warm-light look by choice (matches the brand prototype). */
:root{
  --bg:#F9F7F3; --panel:#F2EEE7; --card:#FFFFFF; --ink:#1C1A17; --muted:#6F685E; --line:#E4DED3;
  --gold:#A9824A; --gold-deep:#8A6633; --gold-soft:#EFE4D0;
  --ok:#2F6B46; --ok-bg:#E6F1E9; --hold:#8E6414; --hold-bg:#F7EDD8; --view:#3B5878; --view-bg:#E5ECF4; --sold:#8A2F2F; --sold-bg:#F5E3E1;
  --display:"Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --body:"Manrope", "Segoe UI", system-ui, -apple-system, sans-serif;
  --gut:max(16px, env(safe-area-inset-left, 0px));
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
input,select,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.eyebrow{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:600}
h1,h2,h3{font-family:var(--display);font-weight:500;line-height:1.08;margin:0;text-wrap:balance;letter-spacing:-.005em}
.num{font-variant-numeric:tabular-nums}

/* Header */
header.site{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(249,247,243,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hbar{display:flex;align-items:center;gap:28px;height:76px}
.logo{display:flex;flex-direction:column;text-decoration:none;flex-shrink:0}
.logo b{font-family:var(--display);font-weight:500;font-size:28px;letter-spacing:.06em;line-height:1}
.logo span{font-size:10.5px;letter-spacing:.28em;color:var(--muted);margin-top:5px}
nav.main{display:flex;gap:26px;flex:1}
nav.main a{text-decoration:none;font-size:14.5px;font-weight:500;padding:6px 0;border-bottom:1.5px solid transparent;white-space:nowrap}
nav.main a.on{color:var(--gold-deep);border-color:var(--gold)}
nav.main a:hover{color:var(--gold-deep)}
.hact{display:flex;align-items:center;gap:12px}
.lang{display:flex;border:1px solid var(--line);background:var(--panel);padding:3px}
.lang button{font-size:12px;font-weight:700;padding:4px 8px;color:var(--muted)}
.lang button.on{background:var(--ink);color:#fff}
.iconbtn{position:relative;width:40px;height:40px;display:grid;place-items:center}
.iconbtn svg{width:21px;height:21px}
.dot{position:absolute;top:3px;right:3px;min-width:17px;height:17px;border-radius:9px;background:var(--gold);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.acct{white-space:nowrap;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);padding:9px 14px;font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.bagbtn{white-space:nowrap;display:flex;align-items:center;gap:10px;background:var(--ink);color:#fff;padding:11px 16px;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.bagbtn .cnt{background:var(--gold-soft);color:var(--ink);font-size:11px;padding:0 6px}
.burger{display:none}
.popover{position:absolute;right:0;top:calc(100% + 8px);background:var(--card);border:1px solid var(--line);box-shadow:0 18px 40px -20px rgba(28,26,23,.35);width:340px;max-width:calc(100vw - 32px);z-index:70}
.popover h4{margin:0;padding:14px 16px;border-bottom:1px solid var(--line);font-size:12px;letter-spacing:.16em;text-transform:uppercase}
.notif{padding:12px 16px;border-bottom:1px solid var(--line);font-size:13.5px}
.notif small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
.notif.unread{background:#FBF6EC}
.menu a,.menu button{display:block;width:100%;text-align:left;padding:12px 16px;border-bottom:1px solid var(--line);text-decoration:none;font-size:14px}
.menu a:hover,.menu button:hover{background:var(--panel)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;padding:16px 26px;font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;text-decoration:none;border:1px solid var(--ink);transition:background .2s,color .2s}
.btn.dark{background:var(--ink);color:#fff}
.btn.dark:hover{background:#000}
.btn.line{border-color:var(--gold);background:transparent}
.btn.line:hover{background:var(--gold-soft)}
.btn.sm{padding:10px 14px;font-size:11.5px;letter-spacing:.08em}
.btn[disabled]{opacity:.38;cursor:not-allowed}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.warn{border-color:var(--sold);color:var(--sold)}

/* Hero */
.hero{display:grid;grid-template-columns:1fr 1.05fr;gap:56px;align-items:center;padding-block:64px 56px}
.hero h1{font-size:clamp(40px,5.2vw,68px);margin:22px 0 24px}
.hero p.lead{font-size:19px;color:var(--muted);max-width:34em;margin:0 0 34px;font-weight:300}
.hero .ctas{display:flex;gap:18px;flex-wrap:wrap}
.stocknote{margin-top:34px;padding-top:16px;border-top:1px solid var(--line);font-size:13.5px;color:var(--muted)}
.stocknote i{font-family:var(--display);font-size:16px;color:var(--gold);margin-right:10px}
.slider{position:relative;aspect-ratio:1.24;overflow:hidden;background:#222;max-width:100%}
.slide{position:absolute;inset:0;opacity:0;transition:opacity .9s ease}
.slide.on{opacity:1}
.slide img{width:100%;height:100%;object-fit:cover;display:block}
.slide::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(10,8,5,.72))}
.slide .cap{position:absolute;left:30px;bottom:26px;z-index:2;color:#fff}
.slide .cap b{display:block;font-family:var(--display);font-weight:500;font-size:25px}
.slide .cap span{font-size:12px;letter-spacing:.16em;text-transform:uppercase;opacity:.85}
.sdots{position:absolute;right:24px;bottom:30px;z-index:3;display:flex;gap:8px}
.sdots button{width:26px;height:2px;background:rgba(255,255,255,.45)}
.sdots button.on{background:#fff}
.snext{position:absolute;right:16px;top:50%;transform:translateY(-50%);z-index:3;width:46px;height:46px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center}
.sprev{left:16px;right:auto}

/* Trust strip */
.trust{display:grid;grid-template-columns:repeat(4,1fr);border-block:1px solid var(--line);background:var(--panel)}
.trust div{padding:22px 24px;border-right:1px solid var(--line)}
.trust div:last-child{border-right:0}
.trust b{display:block;font-family:var(--display);font-size:21px;font-weight:500}
.trust span{font-size:13px;color:var(--muted)}

/* Collection */
.sec{padding-block:72px}
.sechead{text-align:center;margin-bottom:38px}
.sechead h2{font-size:clamp(34px,4vw,50px);margin:12px 0 10px}
.sechead p{color:var(--muted);font-size:17px;margin:0;font-weight:300}
.tabs{display:flex;justify-content:center;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:30px}
.tabs button{padding:14px 20px;font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-color:var(--gold);background:var(--panel)}
.filters{background:var(--panel);border:1px solid var(--line);padding:22px 24px;display:grid;gap:18px;margin-bottom:34px}
.frow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.field{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);padding:0 14px;height:48px;min-width:0}
.field input,.field select{border:0;background:transparent;outline:0;width:100%;height:100%;font-size:14.5px;min-width:0}
.avail{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:16px;font-size:14px;color:var(--muted)}
.chip{border:1px solid var(--line);background:var(--card);padding:6px 14px;font-size:13.5px;color:var(--ink)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.avail .found{margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:34px 28px}
.card{display:flex;flex-direction:column;text-decoration:none;cursor:pointer}
.card .ph{position:relative;aspect-ratio:1/1.05;overflow:hidden;background:#1d1b18}
.card .ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .8s ease}
.card:hover .ph img{transform:scale(1.045)}
.card.sold .ph img{filter:grayscale(.85) brightness(.85)}
.badge-cert{position:absolute;left:16px;top:16px;background:rgba(20,18,15,.82);color:#fff;font-size:12.5px;font-weight:600;letter-spacing:.04em;padding:6px 10px;display:flex;gap:6px;align-items:center}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:5px 10px;white-space:nowrap}
.status::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-available{color:var(--ok);background:var(--ok-bg)}
.s-viewing{color:var(--view);background:var(--view-bg)}
.s-payment{color:var(--hold);background:var(--hold-bg)}
.s-sold{color:var(--sold);background:var(--sold-bg)}
.card .ph .status{position:absolute;right:16px;top:16px;background:#fff}
.card .meta{padding:18px 2px 0;display:grid;gap:4px}
.card .meta small{font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.card .meta h3{font-size:24px}
.card .meta .spec{font-size:13.5px;color:var(--muted)}
.card .meta .price{font-size:16px;font-weight:600;margin-top:6px}
.empty{grid-column:1/-1;text-align:center;padding:60px 0;color:var(--muted)}

/* Steps */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid var(--line);background:var(--card)}
.steps div{padding:28px 26px;border-right:1px solid var(--line)}
.steps div:last-child{border-right:0}
.steps em{font-family:var(--display);font-style:italic;font-size:30px;color:var(--gold)}
.steps b{display:block;font-size:15px;margin:8px 0 6px}
.steps p{margin:0;font-size:13.5px;color:var(--muted)}

/* Split feature */
.split{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}
.split img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.split h2{font-size:clamp(32px,3.6vw,46px);margin:14px 0 18px}
.split p{color:var(--muted);font-size:16px;margin:0 0 14px;max-width:34em}

/* Product page */
.crumbs{font-size:13px;color:var(--muted);padding-block:26px 8px}
.crumbs a{text-decoration:none}
.crumbs a:hover{color:var(--gold-deep)}
.pdp{display:grid;grid-template-columns:1.1fr 1fr;gap:56px;padding-bottom:64px}
.gal{display:grid;grid-template-columns:84px 1fr;gap:14px;align-self:start;position:sticky;top:96px}
.thumbs{display:grid;gap:10px;align-content:start}
.thumbs button{aspect-ratio:1;overflow:hidden;border:1px solid var(--line);padding:0;background:#1d1b18;position:relative}
.thumbs button.on{outline:2px solid var(--gold);outline-offset:1px}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs .zoomthumb img{transform:scale(2.1)}
.thumbs .certthumb{background:var(--gold-soft);display:grid;place-items:center;font-family:var(--display);font-size:13px;line-height:1.1;text-align:center;color:var(--gold-deep)}
.stage{position:relative;aspect-ratio:1;overflow:hidden;background:#1d1b18;cursor:zoom-in;max-width:100%}
.stage img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .25s ease}
.stage.zoom img{transform:scale(2.2)}
.stage .hint{position:absolute;left:14px;bottom:14px;background:rgba(255,255,255,.92);font-size:12px;padding:6px 10px;display:flex;gap:6px;align-items:center}
.stage.cert{cursor:default;background:var(--panel)}
.info h1{font-size:clamp(36px,4vw,52px);margin:12px 0 10px}
.info .price{font-size:26px;font-weight:600;margin:6px 0 18px}
.info .price small{font-size:13px;color:var(--muted);font-weight:400;margin-left:8px}
.statusbox{border:1px solid var(--line);background:var(--card);padding:16px 18px;display:flex;gap:14px;align-items:flex-start;margin-bottom:22px}
.statusbox p{margin:4px 0 0;font-size:13.5px;color:var(--muted)}
.info .desc{font-size:16px;color:#3f3a33;margin:0 0 26px}
.buy{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.unique{font-size:13px;color:var(--muted);margin:0 0 30px}
.attrs{width:100%;border-collapse:collapse;margin-bottom:28px;font-size:14px}
.attrs th{text-align:left;font-weight:500;color:var(--muted);padding:11px 0;border-bottom:1px solid var(--line);width:42%}
.attrs td{padding:11px 0;border-bottom:1px solid var(--line);font-weight:500}
.certcard{display:flex;gap:18px;align-items:center;border:1px solid var(--gold);background:#FCF8F0;padding:18px;margin-bottom:22px}
.seal{width:58px;height:58px;border-radius:50%;border:1.5px solid var(--gold);display:grid;place-items:center;font-family:var(--display);font-size:13px;color:var(--gold-deep);flex-shrink:0;text-align:center;line-height:1}
.certcard div{flex:1;min-width:0}
.certcard b{display:block;font-size:14.5px}
.certcard span{font-size:13px;color:var(--muted)}
details.acc{border-top:1px solid var(--line)}
details.acc:last-of-type{border-bottom:1px solid var(--line)}
details.acc summary{padding:16px 0;cursor:pointer;font-weight:600;font-size:14px;letter-spacing:.06em;text-transform:uppercase;list-style:none;display:flex;justify-content:space-between}
details.acc summary::after{content:"+";color:var(--gold);font-size:18px}
details.acc[open] summary::after{content:"–"}
details.acc p{margin:0 0 16px;color:var(--muted);font-size:14px}

/* Certificate doc */
.certdoc{background:#FFFDF8;border:1px solid #D9C7A4;outline:6px double #E6D7B9;outline-offset:-14px;padding:42px 44px;font-size:13.5px;position:relative;width:100%;height:100%;overflow:auto}
.certdoc h3{font-size:30px;text-align:center}
.certdoc .sub{text-align:center;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold-deep);margin:6px 0 22px}
.certdoc dl{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;margin:0}
.certdoc dt{color:var(--muted)}
.certdoc dd{margin:0;font-weight:600}
.certdoc .sign{display:flex;justify-content:space-between;align-items:flex-end;margin-top:26px;gap:16px}
.certdoc .sign i{font-family:var(--display);font-size:22px;border-bottom:1px solid var(--ink);padding:0 16px 2px}

/* Drawer + modal */
.scrim{position:fixed;inset:0;background:rgba(20,18,15,.45);z-index:80;display:flex;justify-content:flex-end}
.scrim.center{justify-content:center;align-items:center;padding:16px}
.drawer{width:min(460px,100vw);height:100%;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.dhead{display:flex;justify-content:space-between;align-items:center;padding:22px 24px;border-bottom:1px solid var(--line)}
.dhead h3{font-size:28px}
.dbody{flex:1;overflow:auto;padding:20px 24px;display:grid;gap:18px;align-content:start}
.dfoot{border-top:1px solid var(--line);padding:20px 24px;display:grid;gap:12px;background:var(--card)}
.line-item{display:grid;grid-template-columns:76px 1fr auto;gap:14px;align-items:center}
.line-item img{width:76px;height:76px;object-fit:cover}
.line-item b{font-family:var(--display);font-size:20px;font-weight:500;display:block;line-height:1.1}
.line-item small{color:var(--muted);font-size:12.5px}
.opt{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);background:var(--card);padding:14px 16px;cursor:pointer}
.opt:has(input:checked){border-color:var(--gold);background:#FCF8F0}
.opt input{accent-color:var(--gold);margin-top:4px}
.opt span{flex:1;font-size:14px}
.opt small{display:block;color:var(--muted);font-size:12.5px}
.tot{display:flex;justify-content:space-between;font-size:14px}
.tot.big{font-size:18px;font-weight:700}
.modal{background:var(--bg);width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;position:relative}
.modal.wide{width:min(720px,100%)}
.mbody{padding:30px 32px;display:grid;gap:16px}
.mbody h3{font-size:32px}
.mbody p{margin:0;color:var(--muted)}
.close{position:absolute;right:12px;top:12px;width:40px;height:40px;display:grid;place-items:center;font-size:22px}
.fgrid{display:grid;gap:12px}
.fgrid label{display:grid;gap:6px;font-size:12.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.fgrid input,.fgrid textarea{border:1px solid var(--line);background:var(--card);padding:12px 14px;font-size:15px;text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink)}
.bank{border:1px dashed var(--gold);background:#FCF8F0;padding:16px 18px;display:grid;gap:8px;font-size:14px}
.bank div{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.bank span{color:var(--muted)}
.bank b{font-variant-numeric:tabular-nums;word-break:break-all}
.notice{font-size:13px;background:var(--panel);padding:12px 14px;color:var(--muted)}
.countdown{font-variant-numeric:tabular-nums;font-weight:700}

/* Pages */
.pagehead{padding-block:64px 36px;text-align:center}
.pagehead h1{font-size:clamp(40px,5vw,60px);margin:14px 0 12px}
.pagehead p{color:var(--muted);font-size:17px;max-width:40em;margin:0 auto}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin-top:40px}
.facts div{border-top:1px solid var(--gold);padding-top:16px}
.facts b{font-family:var(--display);font-size:22px;font-weight:500;display:block;margin-bottom:6px}
.facts p{margin:0;color:var(--muted);font-size:14.5px}

/* Account */
.acgrid{display:grid;grid-template-columns:280px 1fr;gap:40px;padding-bottom:70px}
.box{background:var(--card);border:1px solid var(--line);padding:22px}
.box h3{font-size:26px;margin-bottom:6px}
.rec{display:grid;grid-template-columns:72px 1fr auto;gap:16px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}
.rec:last-child{border-bottom:0}
.rec img{width:72px;height:72px;object-fit:cover}
.rec b{display:block;font-size:15px}
.rec small{color:var(--muted);font-size:12.5px;display:block}

/* Staff */
.staffbar{background:var(--ink);color:#EDE6D8}
.staffbar .wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:12px;font-size:13px}
.staffbar b{color:#fff;letter-spacing:.08em;text-transform:uppercase;font-size:12px}
.staffbar .sp{flex:1}
.staffbar button{border:1px solid rgba(255,255,255,.3);padding:7px 12px;font-size:12px;color:#fff}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:28px 0}
.kpi{background:var(--card);border:1px solid var(--line);padding:18px 20px;display:grid;gap:4px}
.kpi span{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.kpi b{font-family:var(--display);font-size:40px;font-weight:500;line-height:1}
.kpi.c-ok b{color:var(--ok)}.kpi.c-view b{color:var(--view)}.kpi.c-hold b{color:var(--hold)}.kpi.c-sold b{color:var(--sold)}
.stabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
.stabs button{padding:12px 16px;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.stabs button.on{color:var(--ink);border-color:var(--gold)}
.stabs .n{background:var(--gold);color:#fff;font-size:10.5px;padding:1px 6px;margin-left:6px}
.inv{display:grid;gap:10px;padding-bottom:70px}
.irow{display:grid;grid-template-columns:64px minmax(0,2fr) 110px 200px 340px;gap:18px;align-items:center;background:var(--card);border:1px solid var(--line);padding:12px 16px}
.irow img{width:64px;height:64px;object-fit:cover}
.irow b{display:block;font-size:15px}
.irow small{color:var(--muted);font-size:12.5px;display:block}
.irow .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.confirm{grid-column:1/-1;background:var(--hold-bg);padding:12px 14px;font-size:13.5px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.log{font-size:13.5px}
.log div{padding:10px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:150px 1fr;gap:14px}
.log span{color:var(--muted)}
.stafflogin{max-width:460px;margin:70px auto;text-align:center}
.stafflogin .box{display:grid;gap:14px;text-align:left}

footer{background:var(--ink);color:#CFC6B6;margin-top:40px}
footer .wrap{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:30px;padding-block:52px 40px}
footer b{color:#fff;display:block;margin-bottom:10px;font-size:12px;letter-spacing:.16em;text-transform:uppercase}
footer p,footer a{font-size:13.5px;margin:0 0 6px;display:block;text-decoration:none}
footer .logo b{color:#fff;font-size:24px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:14px 20px;font-size:14px;z-index:90;max-width:calc(100vw - 32px);box-shadow:0 12px 30px -10px rgba(0,0,0,.5)}
.demo-tag{position:fixed;left:max(12px, env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--card);border:1px solid var(--line);font-size:11.5px;padding:6px 10px;color:var(--muted)}

@media (max-width:1320px){ .bagbtn .lbl{display:none} nav.main{gap:20px} .hbar{gap:22px} }
@media (max-width:1100px){
  nav.main{gap:16px}
  .acct .nm{display:none}
}
.mobonly{display:none!important}
@media (max-width:960px){
  nav.main{display:none}
  nav.main.open{display:flex;flex-direction:column;position:absolute;left:0;right:0;top:76px;background:var(--bg);border-bottom:1px solid var(--line);padding:8px max(16px, env(safe-area-inset-right,0px)) 16px max(16px, env(safe-area-inset-left,0px));gap:0}
  nav.main.open a{padding:14px 0;border-bottom:1px solid var(--line)}
  .burger{display:grid}
  .hero,.split,.pdp{grid-template-columns:1fr;gap:32px}
  .gal{position:static}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .frow{grid-template-columns:repeat(2,minmax(0,1fr))}
  .trust,.steps,.kpis{grid-template-columns:repeat(2,1fr)}
  .trust div:nth-child(2),.steps div:nth-child(2){border-right:0}
  .trust div:nth-child(-n+2),.steps div:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .acgrid{grid-template-columns:1fr}
  .irow{grid-template-columns:56px minmax(0,1fr)}
  .irow img{width:56px;height:56px}
  .irow .c3,.irow .c4{display:none}
  .irow .acts{grid-column:1/-1;justify-content:flex-start}
  footer .wrap{grid-template-columns:1fr 1fr}
  .facts{grid-template-columns:1fr}
}
@media (max-width:620px){
  .hbar{height:64px;gap:10px}
  nav.main.open{top:64px}
  .logo{min-width:0;flex:1}
  .logo b{font-size:16px;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .logo span{font-size:8.5px;letter-spacing:.2em}
  .hact{gap:4px}
  .bagbtn{padding:10px}
  .lang,.acct,.demo-tag{display:none}
  nav.main.open .mobonly{display:block!important}
  .bagbtn{padding:10px 12px}
  .bagbtn .lbl{display:none}
  .grid{grid-template-columns:1fr}
  .frow{grid-template-columns:1fr}
  .buy{grid-template-columns:1fr}
  .gal{grid-template-columns:1fr}
  .thumbs{grid-template-columns:repeat(4,1fr);order:2}
  .hero{padding-block:32px}
  .tabs{justify-content:flex-start;flex-wrap:nowrap;overflow-x:auto}
  .tabs button{white-space:nowrap;padding:12px 14px}
  .mbody{padding:26px 20px}
  .certdoc{padding:30px 24px}
  .log div{grid-template-columns:1fr;gap:2px}
  footer .wrap{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

let S;
try{ S = JSON.parse(localStorage.getItem(KEY)) }catch(e){ S = null }
if(!S || !S.status) S = seed();
const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(S)) }catch(e){} };
const now = () => Date.now() + S.offset;
const t = k => String(T[S.lang][k] ?? T.en[k] ?? k).replace("{n}", PRODUCTS.length);
const fill = (s,o) => s.replace(/\{(\w+)\}/g,(m,k)=>o[k]??m);
const st = id => S.status[id] || "available";
const eur = n => new Intl.NumberFormat(S.lang==="it"?"it-IT":"en-IE",{style:"currency",currency:"EUR",maximumFractionDigits:0}).format(n);
const fdt = ms => new Intl.DateTimeFormat(S.lang==="it"?"it-IT":"en-GB",{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}).format(new Date(ms));
const left = ms => { const d=Math.max(0,ms-now()); const h=Math.floor(d/H), m=Math.floor(d%H/60000); return h+"h "+String(m).padStart(2,"0")+"m "+t("left") };
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $ = (s,r=document) => r.querySelector(s);
const pn = p => p.name;
const statusPill = s => `<span class="status s-${s}">${t(s)}</span>`;
function notify(to,key,vars){ S.notif.unshift({to,text:{en:fill(T.en[key],vars),it:fill(T.it[key],vars)},t:now(),read:false}) }
function log(key,vars,raw){ S.log.push({t:now(),text: raw || {en:fill(T.en[key],vars),it:fill(T.it[key],vars)}}) }
function rawlog(en,it){ S.log.push({t:now(),text:{en,it}}) }

// expire holds
function sweep(){
  let changed=false;
  S.orders.forEach(o=>{ if(o.status==="awaiting" && o.expires<=now()){ o.status="expired"; if(st(o.pid)==="payment") delete S.status[o.pid]; notify(o.email===S.user?.email?"customer":"staff","nExpired",{item:byId(o.pid).name}); rawlog("Payment hold expired for "+o.ref,"Blocco pagamento scaduto per "+o.ref); changed=true }});
  S.res.forEach(r=>{ if(r.status==="active" && r.expires<=now()){ r.status="expired"; if(st(r.pid)==="viewing") delete S.status[r.pid]; notify(r.email===S.user?.email?"customer":"staff","nExpired",{item:byId(r.pid).name}); rawlog("Viewing hold expired: "+byId(r.pid).name,"Visione scaduta: "+byId(r.pid).name); changed=true }});
  if(changed) save();
}

let toastTimer;
function toast(msg){ let el=$("#toast"); if(!el){el=document.createElement("div");el.id="toast";el.className="toast";el.setAttribute("role","status");document.body.appendChild(el)} el.textContent=msg; el.hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.hidden=true,3200) }

const NAV = [["collection","navCollection"],["maison","navMaison"],["boutique","navBoutique"],["authenticity","navAuth"]]; // staff console hidden in client prototype
function renderHeader(view){
  $("#nav").innerHTML = NAV.map(([h,k])=>`<a href="#${h==="collection"?"home":h}" ${h==="collection"?'data-go="collection"':""} class="${(view===h||(h==="collection"&&(view==="home"||view==="product")))?"on":""}">${t(k)}</a>`).join("")+`<a href="#account" class="mobonly">${t("myAccount")}</a><a href="#" class="mobonly" id="mlang">${t("langSw")}</a>`;
  $("#mlang").onclick=e=>{e.preventDefault(); S.lang=S.lang==="it"?"en":"it"; save(); $("#nav").classList.remove("open"); render()};
  document.querySelectorAll("#lang button").forEach(b=>b.classList.toggle("on",b.dataset.l===S.lang));
  $("#acctname").textContent = S.role==="staff"&&S.staffIn ? "MARCO · STAFF" : (S.user? S.user.name.split(" ")[0].toUpperCase() : t("guest"));
  $("#bagcnt").textContent = S.bag.length;
  const role = S.role==="staff"&&S.staffIn ? "staff":"customer";
  const unread = S.notif.filter(n=>n.to===role && !n.read).length;
  $("#belldot").hidden = !unread; $("#belldot").textContent = unread;
  document.querySelectorAll("[data-t]").forEach(el=>el.textContent=t(el.dataset.t));
  document.documentElement.lang = S.lang;
}
function closePops(){ $("#bellpop").innerHTML=""; $("#acctpop").innerHTML="" }
$("#bell").onclick = e => { e.stopPropagation(); const open=$("#bellpop").innerHTML; closePops(); if(open) return;
  const role = S.role==="staff"&&S.staffIn ? "staff":"customer";
  const list = S.notif.filter(n=>n.to===role).slice(0,8);
  $("#bellpop").innerHTML = `<div class="popover"><h4>${t("notifs")}</h4>${list.length?list.map(n=>`<div class="notif ${n.read?"":"unread"}">${esc(n.text[S.lang])}<small>${fdt(n.t)}</small></div>`).join(""):`<div class="notif">${t("noNotif")}</div>`}<div class="menu"><button id="markread">${t("markRead")}</button></div></div>`;
  $("#markread").onclick=()=>{ S.notif.forEach(n=>{if(n.to===role)n.read=true}); save(); closePops(); render() };
};
$("#acct").onclick = e => { e.stopPropagation(); const open=$("#acctpop").innerHTML; closePops(); if(open) return;
  if(!S.user && !(S.role==="staff"&&S.staffIn)){ openLogin(); return }
  $("#acctpop").innerHTML = `<div class="popover menu" style="width:240px"><a href="#account">${t("myAccount")}</a><button id="so">${t("signOut")}</button></div>`;
  $("#so").onclick=()=>{ S.user=null; S.staffIn=false; S.role="customer"; save(); closePops(); location.hash="#home"; render() };
};
document.addEventListener("click", e=>{ if(!e.target.closest(".popover")) closePops();
  const go=e.target.closest("[data-go]"); if(go){ e.preventDefault(); goCollection() } });
$("#lang").onclick = e => { const l=e.target.dataset.l; if(l){ S.lang=l; save(); render() } };
$("#bagbtn").onclick = () => openBag();
$("#burger").onclick = () => $("#nav").classList.toggle("open");
function goCollection(){ if(view()!=="home"){ location.hash="#home"; setTimeout(()=>$("#collection")?.scrollIntoView({behavior:"smooth"}),60) } else $("#collection")?.scrollIntoView({behavior:"smooth"}); $("#nav").classList.remove("open") }

function filtered(){
  let list = PRODUCTS.filter(p=>{
    if(F.cat!=="all" && p.cat!==F.cat) return false;
    if(F.metal && p.metal!==F.metal) return false;
    if(F.price==="p1" && p.price>=3000) return false;
    if(F.price==="p2" && (p.price<3000||p.price>7000)) return false;
    if(F.price==="p3" && (p.price<7000||p.price>15000)) return false;
    if(F.price==="p4" && p.price<=15000) return false;
    if(F.avail && st(p.id)!=="available") return false;
    if(F.q){ const q=F.q.toLowerCase(); const hay=[p.name,p.sku,p.stone.en,p.stone.it,p.era,METALS[p.metal].en,METALS[p.metal].it,t(p.cat),"cert "+p.cert].join(" ").toLowerCase(); if(!hay.includes(q)) return false }
    return true });
  list.sort((a,b)=> F.sort==="low"? a.price-b.price : F.sort==="high"? b.price-a.price : a.added-b.added);
  return list;
}
function cardHTML(p){
  const s=st(p.id);
  return `<a class="card ${s==="sold"?"sold":""}" href="#product-${p.id}">
    <div class="ph"><img src="${IMG(p.img)}" alt="${esc(p.name)}" loading="lazy"><span class="badge-cert"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/></svg>CERT #${p.cert}</span>${statusPill(s)}</div>
    <div class="meta"><small>${t(p.cat)} · ${p.era}</small><h3>${esc(p.name)}</h3><div class="spec">${METALS[p.metal][S.lang]}${p.stone.en!=="—"?" · "+esc(p.stone[S.lang]):""}</div><div class="price num">${eur(p.price)}</div></div></a>`;
}
function renderGrid(){

function bindHome(){
  $("#tabs").onclick=e=>{const c=e.target.dataset.c; if(!c) return; F.cat=c; document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.c===c)); renderGrid()};
  $("#fq").oninput=e=>{F.q=e.target.value; renderGrid()};

  $("#fp").onchange=e=>{F.price=e.target.value; renderGrid()};

  const sl=$("#slider");
  const show=i=>{ slideIdx=(i+SLIDES.length)%SLIDES.length; sl.querySelectorAll(".slide").forEach((s,j)=>s.classList.toggle("on",j===slideIdx)); sl.querySelectorAll(".sdots button").forEach((s,j)=>s.classList.toggle("on",j===slideIdx)) };
  sl.onclick=e=>{const b=e.target.closest("[data-s],[data-d]"); if(!b) return; if(b.dataset.s) show(slideIdx+ +b.dataset.s); else show(+b.dataset.d); restart()};

}

      if(s==="viewing"&&r) acts=`<button class="btn sm ok" data-vsold="${r.id}">${t("soldAtViewing")}</button><button class="btn sm line" data-vrel="${r.id}">${t("release")}</button>`;
      if(s==="sold") acts=`<button class="btn sm line" data-relist="${p.id}">${t("relist")}</button>`;
      return `<div class="irow"><img src="${IMG(p.img)}" alt=""><div style="min-width:0"><b>${esc(p.name)}</b><small>${p.sku} · CERT #${p.cert}</small></div><div class="c3 num">${eur(p.price)}</div><div class="c4">${statusPill(s)}${o?`<small class="countdown">${t("expires")}: ${left(o.expires)}</small>`:r?`<small class="countdown">${t("expires")}: ${left(r.expires)}</small>`:""}</div><div class="acts">${acts}</div>${confirmFor===p.id?`<div class="confirm">${t("confirmSoldQ")}<button class="btn sm dark" data-yes="${p.id}">${t("yes")}</button><button class="btn sm line" data-no>${t("no")}</button></div>`:""}</div>`}).join("")}</div>`;
  } else if(sTab==="orders"){
    const all=S.orders.slice().reverse();
    body=`<div class="inv">${all.map(o=>{const p=byId(o.pid);return `<div class="irow"><img src="${IMG(p.img)}" alt=""><div style="min-width:0"><b>${o.ref} · ${esc(p.name)}</b><small>${t("customer")}: ${esc(o.customer)} · ${esc(o.email)}</small><small>${o.delivery==="pickup"?t("dPickup"):t("dCourier")}</small></div><div class="c3 num"><b>${eur(o.total)}</b><small>${t("placed")}: ${fdt(o.created)}</small></div><div class="c4">${o.status==="awaiting"?`<span class="status s-payment">${t("oAwaiting")}</span><small class="countdown">${left(o.expires)}</small>`:`<span class="status ${o.status==="paid"?"s-available":"s-sold"}">${t({paid:"oPaid",cancelled:"oCancelled",expired:"oExpired"}[o.status])}</span>`}</div><div class="acts">${o.status==="awaiting"?`<button class="btn sm ok" data-pay="${o.id}">${t("confirmPay")}</button><button class="btn sm warn" data-cancelo="${o.id}">${t("cancelOrder")}</button>`:""}</div></div>`}).join("")}</div>`;
  } else if(sTab==="views"){
    const all=S.res.slice().reverse();
    body=`<div class="inv">${all.map(r=>{const p=byId(r.pid);return `<div class="irow"><img src="${IMG(p.img)}" alt=""><div style="min-width:0"><b>${esc(p.name)}</b><small>${esc(r.customer)} · ${esc(r.phone||r.email)}</small>${r.note?`<small>“${esc(r.note)}”</small>`:""}</div><div class="c3"><small>${t("placed")}: ${fdt(r.created)}</small></div><div class="c4">${r.status==="active"?`<span class="status s-viewing">${t("rActive")}</span><small class="countdown">${left(r.expires)}</small>`:`<span class="status s-sold">${t({completed:"rDone",purchased:"rPurchased",expired:"rExpired",cancelled:"rCancelled"}[r.status])}</span>`}</div><div class="acts">${r.status==="active"?`<button class="btn sm ok" data-vsold="${r.id}">${t("soldAtViewing")}</button><button class="btn sm line" data-vrel="${r.id}">${t("release")}</button>`:""}</div></div>`}).join("")}</div>`;
  } else {
    body=`<div class="box log" style="margin-bottom:70px">${S.log.slice().reverse().map(l=>`<div><span>${fdt(l.t)}</span>${esc(l.text[S.lang])}</div>`).join("")}</div>`;
  }
  return `<div class="staffbar"><div class="wrap"><b>${t("staffTitle")}</b><span>${t("staffUser")}</span><span class="sp"></span><span>${t("perHold")}</span><button id="sim">${t("sim")}</button><button id="reset">${t("reset")}</button><button id="exitstaff">${t("exitStaff")}</button></div></div>
  <div class="wrap"><div class="kpis"><div class="kpi c-ok"><span>${t("kAvail")}</span><b class="num">${cnt("available")}</b></div><div class="kpi c-view"><span>${t("kView")}</span><b class="num">${cnt("viewing")}</b></div><div class="kpi c-hold"><span>${t("kPay")}</span><b class="num">${cnt("payment")}</b></div><div class="kpi c-sold"><span>${t("kSold")}</span><b class="num">${cnt("sold")}</b></div></div>
  <div class="stabs"><button data-st="inv" class="${sTab==="inv"?"on":""}">${t("inv")}</button><button data-st="orders" class="${sTab==="orders"?"on":""}">${t("orders")}${ordersOpen.length?`<span class="n">${ordersOpen.length}</span>`:""}</button><button data-st="views" class="${sTab==="views"?"on":""}">${t("viewings")}${resOpen.length?`<span class="n">${resOpen.length}</span>`:""}</button><button data-st="log" class="${sTab==="log"?"on":""}">${t("activity")}</button></div>
  ${body}</div>`;
}
function bindStaff(){
  if($("#staffin")){ $("#staffin").onclick=()=>{ S.role="staff"; S.staffIn=true; save(); render(); toast(t("toastIn")) }; return }
  const on=(sel,fn)=>document.querySelectorAll(sel).forEach(b=>b.onclick=()=>fn(b));
  on("[data-st]",b=>{sTab=b.dataset.st; confirmFor=null; render()});
  on("[data-sf]",b=>{sFilter=b.dataset.sf; render()});
  $("#sq")&&($("#sq").oninput=e=>{sQ=e.target.value; const pos=e.target.selectionStart; render(); const el=$("#sq"); el.focus(); el.setSelectionRange(pos,pos)});
  on("[data-sold]",b=>{confirmFor=+b.dataset.sold; render()});
  on("[data-no]",()=>{confirmFor=null; render()});
  on("[data-yes]",b=>{ const id=+b.dataset.yes; if(st(id)!=="available"){ toast(t("holdWarn")); confirmFor=null; render(); return } S.status[id]="sold"; S.bag=S.bag.filter(x=>x!==id); rawlog(byId(id).name+" marked as sold in boutique",byId(id).name+" segnato venduto in boutique"); confirmFor=null; save(); render(); toast(t("toastSold")) });
  on("[data-pay]",b=>{ const o=S.orders.find(x=>x.id===b.dataset.pay); o.status="paid"; S.status[o.pid]="sold"; const p=byId(o.pid); notify(o.email===S.user?.email?"customer":"staff","nPaid",{ref:o.ref,item:p.name}); rawlog("Payment confirmed for "+o.ref+" ("+p.name+")","Pagamento confermato per "+o.ref+" ("+p.name+")"); save(); render(); toast(t("toastPaid")) });
  on("[data-cancelo]",b=>{ const o=S.orders.find(x=>x.id===b.dataset.cancelo); o.status="cancelled"; delete S.status[o.pid]; rawlog("Order "+o.ref+" cancelled","Ordine "+o.ref+" annullato"); save(); render(); toast(t("toastCancel")) });
  on("[data-vsold]",b=>{ const r=S.res.find(x=>x.id===b.dataset.vsold); r.status="purchased"; S.status[r.pid]="sold"; rawlog(byId(r.pid).name+" sold at viewing to "+r.customer,byId(r.pid).name+" venduto alla visione a "+r.customer); if(r.email===S.user?.email) notify("customer","nViewDone",{item:byId(r.pid).name}); save(); render(); toast(t("toastSold")) });
  on("[data-vrel]",b=>{ const r=S.res.find(x=>x.id===b.dataset.vrel); r.status="completed"; delete S.status[r.pid]; rawlog("Viewing hold released: "+byId(r.pid).name,"Visione rilasciata: "+byId(r.pid).name); if(r.email===S.user?.email) notify("customer","nViewDone",{item:byId(r.pid).name}); save(); render(); toast(t("toastRel")) });
  on("[data-relist]",b=>{ const id=+b.dataset.relist; delete S.status[id]; rawlog(byId(id).name+" returned to the collection",byId(id).name+" rimesso in vendita"); save(); render(); toast(t("toastRel")) });
  $("#sim").onclick=()=>{ S.offset+=24*H; sweep(); save(); render(); toast(t("simT")) };
  $("#reset").onclick=()=>{ const l=S.lang; S=seed(); S.lang=l; S.role="staff"; S.staffIn=true; save(); render(); toast(t("toastReset")) };
  $("#exitstaff").onclick=()=>{ S.role="customer"; S.staffIn=false; save(); location.hash="#home" };
}

/* ---------- overlays ---------- */
function closeLayer(){ $("#layer").innerHTML=""; document.body.style.overflow="" }
function openModal(html,cls=""){
  $("#layer").innerHTML=`<div class="scrim center" id="scrim"><div class="modal ${cls}" role="dialog" aria-modal="true"><button class="close" id="mclose" aria-label="Close">×</button>${html}</div></div>`;
  document.body.style.overflow="hidden";
  $("#scrim").onclick=e=>{ if(e.target.id==="scrim") closeLayer() }; $("#mclose").onclick=closeLayer;
}
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeLayer() });
function requireLogin(fn){ if(S.user) fn(); else openLogin(fn) }
function openLogin(after){
  openModal(`<form class="mbody" id="lf"><div class="eyebrow">${t("myAccount")}</div><h3>${t("loginTitle")}</h3><p>${t("loginLead")}</p><div class="fgrid"><label>${t("name")}<input id="ln" value="Giulia Rossi" required></label><label>${t("email")}<input id="le" type="email" value="giulia.rossi@example.it" required></label><label>${t("password")}<input id="lp" type="password" value="demo-demo" required></label></div><p class="notice">${t("demoFill")}</p><button class="btn dark" type="submit">${t("continue")}</button></form>`);
  $("#lf").onsubmit=e=>{ e.preventDefault(); S.user={name:$("#ln").value.trim()||"Giulia Rossi",email:$("#le").value.trim(),phone:"+39 333 000 0000"}; S.role="customer"; save(); closeLayer(); render(); toast(t("toastIn")); after&&after() };
}
function openBooking(p){
  if(st(p.id)!=="available"){ render(); return }
  openModal(`<form class="mbody" id="bf"><div class="eyebrow">${t("bEyebrow")}</div><h3>${t("bookTitle")}</h3>
    <div class="line-item"><img src="${IMG(p.img)}" alt=""><div><b>${esc(p.name)}</b><small>${p.sku} · ${eur(p.price)}</small></div></div>
    <p>${t("bookLead")}</p>
    <div class="fgrid"><label>${t("phone")}<input id="bp" value="${esc(S.user.phone||"")}"></label><label>${t("note")}<textarea id="bn" rows="2"></textarea></label></div>
    <div class="bank"><div><span>${t("address")}</span><b>Via della Spiga 00, Milano</b></div><div><span>${t("expires")}</span><b>${fdt(now()+48*H)}</b></div></div>
    <button class="btn dark" type="submit">${t("confirmBook")}</button></form>`);
  $("#bf").onsubmit=e=>{ e.preventDefault(); if(st(p.id)!=="available"){ closeLayer(); render(); return }
    const r={id:"r"+(++S.seq),pid:p.id,customer:S.user.name,email:S.user.email,phone:$("#bp").value,note:$("#bn").value,created:now(),expires:now()+48*H,status:"active"};
    S.res.push(r); S.status[p.id]="viewing"; S.bag=S.bag.filter(x=>x!==p.id);
    notify("staff","nViewStaff",{item:p.name,name:S.user.name}); rawlog("Viewing reserved by "+S.user.name+" ("+p.name+")","Visione riservata da "+S.user.name+" ("+p.name+")"); save();
    openModal(`<div class="mbody"><div class="eyebrow">${t("bEyebrow")}</div><h3>${t("bookedTitle")}</h3><div class="line-item"><img src="${IMG(p.img)}" alt=""><div><b>${esc(p.name)}</b><small>${p.sku}</small></div></div><p>${t("bookedT")} <b style="color:var(--ink)">${fdt(r.expires)}</b>.</p><div class="bank"><div><span>${t("address")}</span><b>Via della Spiga 00, Milano</b></div><div><span>Orari</span><b>${t("hours")}</b></div></div><div class="buy"><button class="btn dark" id="ok1">${t("done")}</button><a class="btn line" href="#account" id="ok2">${t("toAccount")}</a></div></div>`);
    $("#ok1").onclick=closeLayer; $("#ok2").onclick=closeLayer; render(); toast(t("toastBooked")) };
}
let deliv="courier";
function openBag(){
  const items=S.bag.map(byId).filter(Boolean);
  const okItems=items.filter(p=>st(p.id)==="available");
  const sub=okItems.reduce((a,p)=>a+p.price,0), ship=okItems.length&&deliv==="courier"?30:0;
  $("#layer").innerHTML=`<div class="scrim" id="scrim"><aside class="drawer" role="dialog" aria-modal="true"><div class="dhead"><h3>${t("bagTitle")}</h3><button class="iconbtn" id="dclose" aria-label="Close" style="font-size:24px">×</button></div>
  <div class="dbody">${items.length?items.map(p=>{const ok=st(p.id)==="available";return `<div class="line-item" style="${ok?"":"opacity:.55"}"><img src="${IMG(p.img)}" alt=""><div><b>${esc(p.name)}</b><small>${p.sku} · CERT #${p.cert}</small>${ok?"":`<small style="color:var(--sold);display:block">${t("unavailableNow")}</small>`}<button class="btn sm" style="border:0;padding:6px 0;color:var(--muted)" data-rm="${p.id}">${t("remove")}</button></div><span class="num" style="font-weight:600">${eur(p.price)}</span></div>`}).join("")+
  `<div><div class="eyebrow" style="margin-bottom:10px">${t("delivery")}</div><div style="display:grid;gap:10px"><label class="opt"><input type="radio" name="dl" value="courier" ${deliv==="courier"?"checked":""}><span>${t("dCourier")}<small>${t("dCourierS")}</small></span><b class="num">${eur(30)}</b></label><label class="opt"><input type="radio" name="dl" value="pickup" ${deliv==="pickup"?"checked":""}><span>${t("dPickup")}<small>${t("dPickupS")}</small></span><b>${t("free")}</b></label></div></div><p class="notice">${t("payNote")}</p>`:`<p style="color:var(--muted)">${t("bagEmpty")}</p>`}</div>
  ${items.length?`<div class="dfoot"><div class="tot"><span>${t("subtotal")}</span><span class="num">${eur(sub)}</span></div><div class="tot"><span>${t("shipping")}</span><span class="num">${ship?eur(ship):t("free")}</span></div><div class="tot big"><span>${t("total")}</span><span class="num">${eur(sub+ship)}</span></div><button class="btn dark" id="place" ${okItems.length?"":"disabled"}>${t("placeOrder")}</button></div>`:""}</aside></div>`;
  document.body.style.overflow="hidden";
  $("#scrim").onclick=e=>{ if(e.target.id==="scrim") closeLayer() }; $("#dclose").onclick=closeLayer;
  document.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{ S.bag=S.bag.filter(x=>x!==+b.dataset.rm); save(); renderHeader(view()); openBag() });
  document.querySelectorAll("[name=dl]").forEach(r=>r.onchange=()=>{ deliv=r.value; openBag() });
  $("#place")&&($("#place").onclick=()=>requireLogin(placeOrder));
}
function placeOrder(){
  const okItems=S.bag.map(byId).filter(p=>p&&st(p.id)==="available");
  if(!okItems.length){ openBag(); return }
  const ship=deliv==="courier"?30:0, created=now(), exp=created+72*H;
  const made=okItems.map((p,i)=>{ const o={id:"o"+(++S.seq),ref:"GO-2026-0"+S.seq,pid:p.id,customer:S.user.name,email:S.user.email,delivery:deliv,total:p.price+(i===0?ship:0),created,expires:exp,status:"awaiting"}; S.orders.push(o); S.status[p.id]="payment"; notify("staff","nOrderStaff",{ref:o.ref,item:p.name}); rawlog("Order "+o.ref+" placed by "+S.user.name,"Ordine "+o.ref+" creato da "+S.user.name); return o });
  S.bag=[]; save(); render();
  const tot=made.reduce((a,o)=>a+o.total,0), ref=made.map(o=>o.ref).join(", ");
  openModal(`<div class="mbody"><div class="eyebrow">${t("accPay")}</div><h3>${t("orderPlaced")}</h3><p>${t("orderPlacedT")} <b style="color:var(--ink)">${fdt(exp)}</b> (72 h).</p>
    ${made.map(o=>`<div class="line-item"><img src="${IMG(byId(o.pid).img)}" alt=""><div><b>${esc(byId(o.pid).name)}</b><small>${o.ref}</small></div><span class="num">${eur(o.total)}</span></div>`).join("")}
    <div class="bank"><div><span>${t("beneficiary")}</span><b>Giallo Oro Gioielli S.r.l.</b></div><div><span>${t("iban")}</span><b id="ibantxt">IT00 X000 0000 0000 0000 0000 000</b></div><div><span>${t("bic")}</span><b>DEMOITMMXXX</b></div><div><span>${t("reference")}</span><b>${ref}</b></div><div><span>${t("amount")}</span><b>${eur(tot)}</b></div></div>
    <div class="buy"><button class="btn line" id="cpy">${t("copy")} IBAN</button><a class="btn dark" href="#account" id="toacc">${t("toAccount")}</a></div></div>`);
  $("#toacc").onclick=closeLayer;
  $("#cpy").onclick=()=>{ const v=$("#ibantxt").textContent; const done=()=>{$("#cpy").textContent=t("copied")}; try{ navigator.clipboard.writeText(v).then(done,()=>{selectText($("#ibantxt"));done()}) }catch(e){ selectText($("#ibantxt")); done() } };
  toast(t("toastOrder"));
}
function selectText(el){ const r=document.createRange(); r.selectNodeContents(el); const s=getSelection(); s.removeAllRanges(); s.addRange(r) }

/* ---------- router ---------- */
function view(){ const h=location.hash.slice(1)||"home"; if(h.startsWith("product-")) return "product"; return ["home","maison","boutique","authenticity","account"].includes(h)?h:"home" }
let lastHash=null;
function render(){
  sweep();
  const v=view(), h=location.hash.slice(1);
  clearInterval(slideTimer);
  const app=$("#app");
  if(v==="product"){ const id=+h.split("-")[1]; if(!byId(id)){ location.replace("#home"); return } if(h!==lastHash) galIdx=0; app.innerHTML=viewProduct(id); bindProduct(id) }
  else if(v==="maison") app.innerHTML=viewMaison();
  else if(v==="boutique") app.innerHTML=viewBoutique();
  else if(v==="authenticity") app.innerHTML=viewAuth();
  else if(v==="staff"){ app.innerHTML=viewStaff(); bindStaff() }
  else if(v==="account"){ app.innerHTML=viewAccount(); bindAccount() }
  else { app.innerHTML=viewHome(); bindHome() }
  renderHeader(v);
  if(h!==lastHash){ if(lastHash!==null) window.scrollTo(0,0); lastHash=h }
}
addEventListener("hashchange",()=>{ closeLayer(); $("#nav").classList.remove("open"); render() });
setInterval(()=>{ document.querySelectorAll(".countdown").length && !$("#layer").innerHTML && !document.activeElement?.matches("input,textarea,select") && render() },30000);
render();
})();
</script>
